name: CI

# The check every pull request must pass before it is merged (the agent merges only on green).
on:
  pull_request:
  push:
    branches: [main, members-area]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The 100% coverage gate and the real-MongoDB end-to-end suite run for members-area code:
      # PRs into it, pushes to it, and the release PR FROM it into main (head_ref), whose run
      # tests the merged result. main's own pushes and PRs keep the plain steps: main still holds
      # the code that is live today. Remove this switch, and the plain unit step, after the
      # members-area release (Chunk 20) has merged.
      MEMBERS_AREA: ${{ github.base_ref == 'members-area' || github.head_ref == 'members-area' || github.ref_name == 'members-area' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Unit tests
        if: env.MEMBERS_AREA != 'true'
        # The ESM flag too: NestJS 12 (members-area) is ESM-only, and the release PR
        # into main runs this step. Harmless on NestJS 11 (measured 2026-11-27).
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand
      - name: Unit tests with 100% coverage
        if: env.MEMBERS_AREA == 'true'
        run: npm run test:cov -- --runInBand
      - name: Start MongoDB 7.0 (replica set + standalone)
        if: env.MEMBERS_AREA == 'true'
        # 7.0.14 = the mongod the local end-to-end runs use (~/.cache/mongodb-binaries), so CI and
        # local measure the same server. Test-only containers on a throwaway runner, no auth.
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7.0.14 --replSet rs0 --bind_ip_all
          docker run -d --name mongo-sa -p 27018:27017 mongo:7.0.14 --bind_ip_all
          for i in $(seq 1 60); do
            docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for i in $(seq 1 60); do
            [ "$(docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done
          [ "$(docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]
          for i in $(seq 1 60); do
            docker exec mongo-sa mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo-sa mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'
      - name: End-to-end tests (real MongoDB)
        if: env.MEMBERS_AREA == 'true'
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/org_e2e?replicaSet=rs0
          MONGO_STANDALONE_URI: mongodb://127.0.0.1:27018/org_e2e_sa
        run: npm run test:e2e -- --runInBand
      - name: Build
        run: npm run build
