name: CI

# The check every pull request must pass before it is merged (the agent merges only on green).
on:
  pull_request:
  push:
    branches: [main, members-area]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Unit tests
        run: npx jest --runInBand
      - name: Build
        run: npm run build
