version: 2
updates:
  # One grouped pull request a month instead of one per package (fewer production
  # deploys). Security fixes are grouped too and open as soon as they appear.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7: ts-jest accepts only <7; decision 2026-11-18 to wait until 2026-12-01.
      - dependency-name: "typescript"
        versions: [">=7"]
      # NestJS 12 goes live with the members-area release (Chunk 20), not on its own:
      # members-area already runs it. Remove at Chunk 20. (Decision 2026-11-27, plan
      # 2026-11-27-org-backend-nestjs-12-migration, R1 = A.)
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # Types follow the runtime (engines.node 24.x). main still has 26 from the 11-27
      # batch: this holds it there (no downgrade, no 26.x patches) until the members-area
      # release brings 24.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all-updates:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
