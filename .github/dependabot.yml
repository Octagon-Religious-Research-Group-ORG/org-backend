version: 2
updates:
  # One grouped pull request a month instead of one per package (fewer production
  # deploys). Security fixes are grouped too and open as soon as they appear.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7: ts-jest accepts only <7; decision 2026-11-18 to wait until 2026-12-01.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all-updates:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
